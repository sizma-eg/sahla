<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سهلة - تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login">
  <div id="logo"></div>
  <h1>سهلة</h1>
  <input id="lu" placeholder="اسم المستخدم" autocomplete="username" dir="ltr">
  <input id="lp" type="password" placeholder="كلمة المرور" autocomplete="current-password" dir="ltr">
  <div id="err"></div>
  <button class="p" id="lb" style="width:100%">دخول</button>
  <p><a href="signup.html" style="color:var(--a)">إنشاء حساب جديد</a></p>
</div>
<script type="module">
import{auth,signInWithEmailAndPassword,onAuthStateChanged,E,$,LOGO}from"./app.js";
$("#logo").innerHTML=LOGO.replace('width="34" height="34"','width="64" height="64"');
if(location.search.includes("x=1"))$("#err").textContent="الحساب لسه مش مفعّل. استنى صاحب النظام يوافق عليه";
onAuthStateChanged(auth,u=>{if(u)location.replace("index.html")});
$("#lb").onclick=async()=>{
  $("#err").textContent="";
  try{await signInWithEmailAndPassword(auth,E($("#lu").value),$("#lp").value)}
  catch(e){$("#err").textContent="اسم المستخدم أو كلمة المرور غلط"}
};
$("#lp").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
</script>
</body>
</html>
