<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سهلة - الموظفين</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="hide">
<div id="hdr"></div>
<main>
  <div class="card">
    <h3>موظف جديد</h3>
    <div class="g">
      <input id="nu" placeholder="اسم المستخدم (إنجليزي)" dir="ltr">
      <input id="np" placeholder="كلمة المرور (6 أحرف+)" dir="ltr">
    </div>
    <div class="row"><button class="p" id="na">إضافة موظف</button><span id="nm"></span></div>
  </div>
  <div id="ulist"></div>
</main>
<script type="module">
import{cfg,db,guard,$,E,esc,initializeApp,getAuth,createUserWithEmailAndPassword,signOut,collection,doc,setDoc,updateDoc,onSnapshot}from"./app.js";

guard("employees.html",()=>{
  onSnapshot(collection(db,"users"),s=>{
    const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.active===b.active?0:a.active?1:-1));
    $("#ulist").innerHTML=l.map(x=>`<div class="card"><b dir="ltr">${esc(x.username)}</b>
      ${x.role==="owner"?'<span class="tag ok">صاحب النظام</span>':
        `<span class="tag ${x.active?"ok":"no"}">${x.active?"مفعّل":"غير مفعّل / ينتظر الموافقة"}</span>
         <button data-u="${x.id}" data-a="${x.active?0:1}" class="${x.active?"":"p"}">${x.active?"تعطيل":"تفعيل"}</button>`}</div>`).join("");
  });

  $("#ulist").onclick=e=>{
    const b=e.target.closest("button[data-u]");
    if(b)updateDoc(doc(db,"users",b.dataset.u),{active:b.dataset.a==="1"});
  };

  $("#na").onclick=async()=>{
    const u=$("#nu").value.trim(),p=$("#np").value;$("#nm").textContent="";
    if(!/^[A-Za-z0-9._-]+$/.test(u)||p.length<6){$("#nm").textContent="اسم إنجليزي من غير مسافات وباسورد 6 أحرف على الأقل";return}
    try{
      const sa=getAuth(initializeApp(cfg,"s"+Date.now()));
      const c=await createUserWithEmailAndPassword(sa,E(u),p);
      await setDoc(doc(db,"users",c.user.uid),{username:u,role:"staff",active:true});
      await signOut(sa);
      $("#nu").value=$("#np").value="";$("#nm").textContent="تمت الإضافة";
    }catch(e){$("#nm").textContent=e.code==="auth/email-already-in-use"?"الاسم ده مستخدم":"حصل خطأ، حاول تاني"}
  };
},true);
</script>
</body>
</html>
