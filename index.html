<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سهلة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e161d;--s:#16222c;--s2:#1d2d3a;--b:#2a3d4d;--t:#e8eef2;--m:#8da2b1;--a:#3ccfa5;--g:#f2b94b;--r:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Cairo,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px}label{display:block;font-size:14px;color:var(--m);margin:10px 0 4px}
button{background:var(--s2);border:1px solid var(--b);border-radius:8px;padding:7px 14px;cursor:pointer}
button.p{background:var(--a);color:#06231b;border-color:var(--a);font-weight:800}button.d{color:var(--r)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--s);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}nav button.on{background:var(--a);color:#06231b;border-color:var(--a)}
main{max-width:1000px;margin:0 auto;padding:16px}
.box{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ad{border-inline-start:4px solid var(--a)}.ad.done{opacity:.55;border-color:var(--m)}
.ad h3{margin:0 0 4px;font-size:19px}.pay{color:var(--g);font-weight:800;font-size:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:2px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--b);font-size:13px}
.yes{border-color:var(--a);color:var(--a)}.no{border-color:var(--r);color:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.m{color:var(--m);font-size:14px}
dialog{background:var(--s);color:var(--t);border:1px solid var(--b);border-radius:14px;width:min(680px,94vw);max-height:92vh;padding:16px}
dialog::backdrop{background:#000a}.checks label{display:inline-flex;gap:4px;align-items:center;margin:4px 10px 4px 0;color:var(--t)}.checks input{width:auto}
#login{max-width:340px;margin:12vh auto}#msg{color:var(--r);min-height:24px}
</style></head><body>
<div id="root"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const COMPANY="يقين للتوريدات العمومية والعمالة الداخلية";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mail=u=>u.trim().toLowerCase()+"@sahla.app";
const PAPERS=[["بطاقة شخصية","بطاقه"],["شهادة ميلاد","ميلاد"],["المؤهل","مؤهل"],["موقف التجنيد","تجنيد|جيش"],["فيش جنائي","فيش"],["برنت تأمينات","برنت"],["نموذج 111","111"],["كعب عمل","كعب"],["جزمة سفتي","جزمه|سفتي"]];
const DJ=[{name:"أمن",kw:"امن"},{name:"بنزينة",kw:"بنزينه,محطه وقود"},{name:"عمال إنتاج",kw:"مصنع,مصانع,انتاج"}];
const DP=["العبور","الشروق","بدر","العاشر من رمضان","6 أكتوبر","مدينة نصر","الساحل الشمالي","شيخ زايد"].map(n=>({name:n,kw:""}));
let me=null,ads=[],users=[],Lst={jobs:DJ,places:DP},instr="",view="ads",F={q:"",job:"",place:"",pt:"",pay:0,age:"",h:"",t:"",i:"",h2:"",st:"active"},editId=null;
const norm=s=>(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[ًٌٍَُِّْـ]/g,"").toLowerCase();
const kws=x=>[x.name,...(x.kw||"").split(",")].map(norm).map(k=>k.trim()).filter(Boolean);
/* ---------- keyword extraction (no AI) ---------- */
function parse(raw){
 const t=norm(raw),RL=raw.split(/\n+/),o={};
 o.job=(Lst.jobs.find(j=>kws(j).some(k=>t.includes(k)))||{}).name||"";
 o.places=Lst.places.filter(p=>kws(p).some(k=>t.includes(k))).map(p=>p.name);
 const pl=RL.filter(l=>/مرتب|راتب|قبض|يومي|اجر/.test(norm(l)));
 const nums=pl.flatMap(l=>(norm(l).match(/\d[\d,]{2,}/g)||[]).map(n=>+n.replace(/,/g,"")));
 const mon=nums.filter(n=>n>=3000),day=nums.filter(n=>n>=150&&n<=1500);
 if(mon.length){o.payType="monthly";o.payMin=Math.min(...mon);o.payMax=Math.max(...mon)}
 else if(day.length){o.payType="daily";o.payMin=Math.min(...day);o.payMax=Math.max(...day)}
 o.payNote=pl.join(" | ");
 const re=/(\d{2})\s*(?:الي|حتي|ل|-|–)\s*(\d{2})/,al=norm(RL.find(l=>/سن/.test(norm(l))&&re.test(norm(l)))||"")||t,m=al.match(re);
 if(m&&+m[1]>=16&&+m[2]<=70&&+m[1]<+m[2]){o.ageMin=+m[1];o.ageMax=+m[2]}
 o.hours=[...new Set(RL.filter(l=>/ساع/.test(norm(l))&&/عمل/.test(norm(l))).flatMap(l=>[...norm(l).matchAll(/(\d{1,2})\s*ساع/g)].map(x=>+x[1])).filter(h=>h>=4&&h<=24))];
 const t2=t.replace(/برنت\s*تامينات?/g,""),yn=(s,neg,pos)=>new RegExp(neg).test(s)?"no":new RegExp(pos).test(s)?"yes":"",N="(لا|بدون)\\s*(يوجد|توجد)?\\s*";
 o.housing=yn(t,N+"سكن","سكن");o.transport=yn(t,N+"مواصلات","مواصلات");o.insurance=yn(t2,N+"تامين","تامين");
 o.advances=/سلف/.test(t)?"yes":"";o.meals=/وجبه|وجبات|اكل/.test(t)?"yes":"";
 o.papers=PAPERS.filter(p=>new RegExp(p[1]).test(t)).map(p=>p[0]);
 return o}
/* ---------- helpers ---------- */
const YN={yes:"يوجد",no:"لا يوجد","":"غير محدد"};
const payTxt=a=>a.payMin?((a.payMin==a.payMax?a.payMin:a.payMin+" – "+a.payMax)+(a.payType=="daily"?" جنيه / اليوم":" جنيه / شهر")):"المرتب غير محدد";
const chip=(l,v)=>v?`<span class="chip ${v=="yes"?"yes":"no"}">${l}: ${YN[v]}</span>`:"";
function adText(a){return [`مطلوب ${a.job||"عمال"} — ${COMPANY}`,a.places?.length?`مكان العمل: ${a.places.join("، ")}`:"",`المرتب: ${payTxt(a)}${a.payNote&&a.payNote.length<90?" ("+a.payNote+")":""}`,a.hours?.length?`عدد ساعات العمل: ${a.hours.join(" أو ")} ساعة`:"",a.ageMin?`السن المطلوب: من ${a.ageMin} إلى ${a.ageMax} سنة`:"",a.nationality?`الجنسية: ${a.nationality}`:"",...[["سكن",a.housing],["مواصلات داخلية",a.transport],["تأمين اجتماعي",a.insurance],["سلف",a.advances],["وجبات",a.meals]].filter(x=>x[1]).map(x=>`${x[0]}: ${YN[x[1]]}`),a.papers?.length?`الأوراق المطلوبة: ${a.papers.join("، ")}`:"",a.notes||""].filter(Boolean).join("\n")}
const ok=a=>(F.st?a.status==F.st:true)&&(!F.job||a.job==F.job)&&(!F.place||(a.places||[]).includes(F.place))&&(!F.pt||a.payType==F.pt)&&(!F.pt||!+F.pay||(a.payMax||0)>=+F.pay)&&(!F.age||((!a.ageMin||+F.age>=a.ageMin)&&(!a.ageMax||+F.age<=a.ageMax)))&&(!F.h||(a.hours||[]).includes(+F.h))&&(!F.t||a.transport==F.t)&&(!F.i||a.insurance==F.i)&&(!F.h2||a.housing==F.h2)&&(!F.q||norm(JSON.stringify(a)).includes(norm(F.q)));
const opts=(arr,v)=>arr.map(x=>{const [k,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(k)}" ${k==v?"selected":""}>${esc(l)}</option>`}).join("");
const ynSel=(id,v)=>`<select id="${id}">${opts([["","غير محدد"],["yes","يوجد"],["no","لا يوجد"]],v||"")}</select>`;
const owner=()=>me?.role=="owner";
/* ---------- views ---------- */
function shell(body){$("#root").innerHTML=`<header><div class="logo"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#3ccfa5"/><path d="M9 17l5 5 9-12" stroke="#06231b" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>سهلة</div>
<nav>${[["ads","الإعلانات"],["instr","التعليمات"],...(owner()?[["set","الإعدادات"]]:[])].map(([k,l])=>`<button data-v="${k}" class="${view==k?"on":""}">${l}</button>`).join("")}</nav><span class="m">${esc(me.name||me.username)}</span><button id="out">خروج</button></header><main>${body}</main><dialog id="dlg"></dialog>`}
function loginView(m=""){$("#root").innerHTML=`<div id="login" class="box"><div class="logo" style="justify-content:center">سهلة</div><label>اسم المستخدم</label><input id="u" autocomplete="username"><label>كلمة السر</label><input id="p" type="password" autocomplete="current-password"><p id="msg">${m}</p><button class="p" id="go" style="width:100%">دخول</button></div>`;
 const go=async()=>{try{await signInWithEmailAndPassword(auth,mail($("#u").value),$("#p").value)}catch(e){$("#msg").textContent="اسم المستخدم أو كلمة السر غير صحيحة"}};$("#go").onclick=go;$("#p").onkeydown=e=>e.key=="Enter"&&go()}
function adsView(){shell(`<div class="box"><div class="row"><input id="fq" placeholder="بحث في الإعلانات" value="${esc(F.q)}" style="flex:1;min-width:160px"><button class="p" id="new">+ إعلان جديد</button></div>
<div class="grid" style="margin-top:8px"><select id="fjob"><option value="">كل الوظايف</option>${opts(Lst.jobs.map(j=>j.name),F.job)}</select>
<select id="fplace"><option value="">كل الأماكن</option>${opts(Lst.places.map(p=>p.name),F.place)}</select>
<select id="fpt">${opts([["","نوع القبض: الكل"],["monthly","شهري"],["daily","يومي"]],F.pt)}</select>
<div><span class="m">أقل قبض: <b id="pv">${F.pay||"—"}</b></span><input id="fpay" type="range" ${F.pt?"":"disabled"} min="0" max="${F.pt=="daily"?1000:25000}" step="${F.pt=="daily"?50:500}" value="${F.pay}"></div>
<input id="fage" type="number" placeholder="سن المتقدم" value="${esc(F.age)}"><select id="fh"><option value="">كل ساعات العمل</option>${opts([[8,"8 ساعات"],[12,"12 ساعة"],[16,"16 ساعة"]],F.h)}</select>
<select id="fh2">${opts([["","السكن: الكل"],["yes","فيه سكن"],["no","بدون سكن"]],F.h2)}</select><select id="ft">${opts([["","المواصلات: الكل"],["yes","فيها مواصلات"],["no","بدون مواصلات"]],F.t)}</select>
<select id="fi">${opts([["","التأمين: الكل"],["yes","فيه تأمين"],["no","بدون تأمين"]],F.i)}</select><select id="fst">${opts([["active","شغالة"],["complete","مكتملة"],["","الكل"]],F.st)}</select></div></div><div id="list"></div>`);list()}
function list(){const r=ads.filter(ok);$("#list").innerHTML=r.length?r.map(a=>`<div class="box ad ${a.status=="complete"?"done":""}"><h3>${esc(a.job||"بدون وظيفة")}</h3><div class="pay">${payTxt(a)}</div>
<div class="m">${esc((a.places||[]).join("، ")||"المكان غير محدد")} ${a.ageMin?` · السن ${a.ageMin}–${a.ageMax}`:""} ${(a.hours||[]).length?` · ${a.hours.join(" / ")} ساعة`:""} ${a.nationality?` · ${esc(a.nationality)}`:""}</div>
<div class="chips">${chip("سكن",a.housing)}${chip("مواصلات",a.transport)}${chip("تأمين",a.insurance)}${chip("سلف",a.advances)}${chip("وجبات",a.meals)}</div>
${(a.papers||[]).length?`<div class="m">الأوراق: ${esc(a.papers.join("، "))}</div>`:""}${a.notes?`<div class="m">${esc(a.notes)}</div>`:""}
<div class="row" style="margin-top:8px"><button data-c="${a.id}">انسخ الإعلان</button><button data-e="${a.id}">تعديل</button><button data-s="${a.id}">${a.status=="complete"?"إعادة فتح":"مكتمل"}</button><button class="d" data-d="${a.id}">حذف</button></div></div>`).join(""):`<div class="box m">مفيش إعلانات بالفلاتر دي. دوس "+ إعلان جديد" والصق نص الإعلان.</div>`}
function form(a={}){const d=$("#dlg");d.innerHTML=`<h3 style="margin-top:0">${editId?"تعديل إعلان":"إعلان جديد"}</h3><label>الصق نص الإعلان</label><textarea id="raw">${esc(a.raw||"")}</textarea><button id="ext">استخرج البيانات</button><p class="m" id="exm">راجع البيانات قبل الحفظ.</p>
<div class="grid"><div><label>الوظيفة</label><select id="job"><option value=""></option>${opts(Lst.jobs.map(j=>j.name),a.job)}</select></div><div><label>نوع القبض</label><select id="pt">${opts([["monthly","شهري"],["daily","يومي"]],a.payType||"monthly")}</select></div><div><label>من</label><input id="pmin" type="number" value="${a.payMin??""}"></div><div><label>إلى</label><input id="pmax" type="number" value="${a.payMax??""}"></div><div><label>السن من</label><input id="amin" type="number" value="${a.ageMin??""}"></div><div><label>السن إلى</label><input id="amax" type="number" value="${a.ageMax??""}"></div></div>
<label>تفاصيل القبض (مثال: 26 يوم عمل + 4 إجازة)</label><input id="pn" value="${esc(a.payNote||"")}">
<label>الأماكن</label><div class="checks" id="pl">${Lst.places.map(p=>`<label><input type="checkbox" value="${esc(p.name)}" ${(a.places||[]).includes(p.name)?"checked":""}>${esc(p.name)}</label>`).join("")}</div>
<label>ساعات العمل</label><div class="checks" id="hr">${[8,12,16].map(h=>`<label><input type="checkbox" value="${h}" ${(a.hours||[]).includes(h)?"checked":""}>${h}</label>`).join("")}</div>
<div class="grid"><div><label>سكن</label>${ynSel("hs",a.housing)}</div><div><label>مواصلات داخلية</label>${ynSel("tr",a.transport)}</div><div><label>تأمين</label>${ynSel("in",a.insurance)}</div><div><label>سلف</label>${ynSel("ad",a.advances)}</div><div><label>وجبات</label>${ynSel("ml",a.meals)}</div><div><label>الجنسية</label><input id="na" value="${esc(a.nationality||"")}"></div></div>
<label>الأوراق المطلوبة</label><div class="checks" id="pp">${PAPERS.map(p=>`<label><input type="checkbox" value="${p[0]}" ${(a.papers||[]).includes(p[0])?"checked":""}>${p[0]}</label>`).join("")}</div>
<label>ملاحظات</label><textarea id="nt">${esc(a.notes||"")}</textarea><div class="row" style="margin-top:12px"><button class="p" id="sv">حفظ</button><button id="cx">إلغاء</button></div>`;d.showModal();
 const fill=o=>{if(o.job)$("#job").value=o.job;if(o.payType)$("#pt").value=o.payType;[["pmin",o.payMin],["pmax",o.payMax],["amin",o.ageMin],["amax",o.ageMax]].forEach(([i,v])=>{if(v!=null)$("#"+i).value=v});$("#pn").value=o.payNote||"";
  document.querySelectorAll("#pl input").forEach(c=>c.checked=(o.places||[]).includes(c.value));document.querySelectorAll("#hr input").forEach(c=>c.checked=(o.hours||[]).includes(+c.value));document.querySelectorAll("#pp input").forEach(c=>c.checked=(o.papers||[]).includes(c.value));
  [["hs","housing"],["tr","transport"],["in","insurance"],["ad","advances"],["ml","meals"]].forEach(([i,k])=>$("#"+i).value=o[k]||"")};
 $("#ext").onclick=()=>{const o=parse($("#raw").value);fill(o);$("#exm").textContent=`تم الاستخراج: ${[o.job,(o.places||[]).join("، "),o.payMin?payTxt(o):"",o.ageMin?`سن ${o.ageMin}-${o.ageMax}`:""].filter(Boolean).join(" | ")||"مفيش بيانات واضحة"} — راجع وعدّل.`};
 $("#cx").onclick=()=>d.close();
 $("#sv").onclick=async()=>{const g=s=>[...document.querySelectorAll(s+" input:checked")].map(c=>c.value),n=i=>$("#"+i).value===""?null:+$("#"+i).value;
  const data={raw:$("#raw").value,job:$("#job").value,payType:$("#pt").value,payMin:n("pmin"),payMax:n("pmax")??n("pmin"),payNote:$("#pn").value,ageMin:n("amin"),ageMax:n("amax"),places:g("#pl"),hours:g("#hr").map(Number),housing:$("#hs").value,transport:$("#tr").value,insurance:$("#in").value,advances:$("#ad").value,meals:$("#ml").value,nationality:$("#na").value,papers:g("#pp"),notes:$("#nt").value};
  try{if(editId)await updateDoc(doc(db,"ads",editId),data);else await addDoc(collection(db,"ads"),{...data,status:"active",by:me.username,createdAt:serverTimestamp()});d.close()}catch(e){$("#exm").textContent="تعذر الحفظ: "+e.message}}}
function instrView(){shell(`<div class="box"><h3 style="margin-top:0">تعليمات الموظفين</h3>${owner()?`<textarea id="it" style="min-height:360px">${esc(instr)}</textarea><button class="p" id="si" style="margin-top:8px">حفظ التعليمات</button>`:`<div style="white-space:pre-wrap">${esc(instr)||"مفيش تعليمات لسه."}</div>`}</div>`)}
function setView(){const ls=a=>a.map(x=>x.name+(x.kw?": "+x.kw:"")).join("\n");
 shell(`<div class="box"><h3 style="margin-top:0">الموظفين</h3>${users.map(u=>`<div class="row m"><b style="color:var(--t)">${esc(u.name||u.username)}</b> (${esc(u.username)}) — ${u.role=="owner"?"المالك":"موظف"}</div>`).join("")}
<div class="grid" style="margin-top:8px"><input id="en" placeholder="الاسم"><input id="eu" placeholder="اسم المستخدم (إنجليزي)"><input id="ep" placeholder="كلمة السر (6 حروف أو أكتر)"></div><button class="p" id="ea" style="margin-top:8px">إضافة موظف</button><p id="em" class="m"></p></div>
<div class="box"><h3 style="margin-top:0">الوظايف</h3><p class="m">سطر لكل وظيفة. تقدر تضيف كلمات بحث بعد النقطتين وتفصل بينها بفاصلة.</p><textarea id="lj">${esc(ls(Lst.jobs))}</textarea>
<h3>الأماكن</h3><textarea id="lp">${esc(ls(Lst.places))}</textarea><button class="p" id="sl" style="margin-top:8px">حفظ القوائم</button></div>`)}
function render(){if(!me)return;view=="ads"?adsView():view=="instr"?instrView():setView()}
/* ---------- events ---------- */
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset,ad=id=>ads.find(a=>a.id==id);
 if(D.v){view=D.v;render()}else if(t.id=="out")signOut(auth);else if(t.id=="new"){editId=null;form()}
 else if(D.e){editId=D.e;form(ad(D.e))}else if(D.c){try{await navigator.clipboard.writeText(adText(ad(D.c)));t.textContent="تم النسخ"}catch{prompt("انسخ الإعلان:",adText(ad(D.c)))}}
 else if(D.s)updateDoc(doc(db,"ads",D.s),{status:ad(D.s).status=="complete"?"active":"complete"});
 else if(D.d){if(confirm("حذف الإعلان نهائياً؟ مش هتقدر ترجعه."))deleteDoc(doc(db,"ads",D.d))}
 else if(t.id=="si"){await setDoc(doc(db,"settings","instructions"),{text:$("#it").value});t.textContent="تم الحفظ"}
 else if(t.id=="sl"){const pr=v=>v.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [n,...k]=l.split(":");return{name:n.trim(),kw:k.join(":").trim()}});await setDoc(doc(db,"settings","lists"),{jobs:pr($("#lj").value),places:pr($("#lp").value)});t.textContent="تم الحفظ"}
 else if(t.id=="ea"){const n=$("#en").value.trim(),u=$("#eu").value.trim(),p=$("#ep").value;if(!u||p.length<6){$("#em").textContent="اكتب اسم مستخدم وكلمة سر 6 حروف على الأقل";return}
  try{const a2=getAuth(initializeApp(firebaseConfig,"sec"+Date.now())),c=await createUserWithEmailAndPassword(a2,mail(u),p);await setDoc(doc(db,"users",c.user.uid),{username:u,name:n,role:"employee"});await signOut(a2);$("#em").textContent="تمت إضافة الموظف"}catch(x){$("#em").textContent="تعذر: "+x.message}}});
